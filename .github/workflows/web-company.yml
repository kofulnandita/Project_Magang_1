name: CI/CD - Web Company

on:
  # CI: jalan di setiap Pull Request ke main yang menyentuh folder WEB_COMPANY
  pull_request:
    branches: [main]
    paths:
      - "WEB_COMPANY/**"
      - ".github/workflows/web-company.yml"
  # CD: deploy otomatis setiap ada push / merge ke main
  push:
    branches: [main]
    paths:
      - "WEB_COMPANY/**"
      - ".github/workflows/web-company.yml"
  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:

# Izin minimum yang dibutuhkan
permissions:
  contents: read

# Batalkan run lama kalau ada push baru di branch/PR yang sama
concurrency:
  group: web-company-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: WEB_COMPANY

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------
  # 1) CI — install, type-check, build
  # ---------------------------------------------------------------
  build:
    name: Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: WEB_COMPANY/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      # Ambil base URL GitHub Pages (mis. /Project_Magang_1) hanya saat akan deploy
      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Untuk PR: simpan hasil build supaya bisa diunduh & dicek reviewer
      - name: Upload build (PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-company-dist
          path: WEB_COMPANY/dist
          retention-days: 7

      # Untuk main: siapkan artifact khusus GitHub Pages
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: WEB_COMPANY/dist

  # ---------------------------------------------------------------
  # 2) CD — deploy ke GitHub Pages (hanya dari main)
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Jangan batalkan deploy yang sedang berjalan
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
